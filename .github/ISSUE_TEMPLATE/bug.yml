name: Bug report
description: Report a reproducible Open Codex problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private source code, or full transcripts.
  - type: input
    id: version
    attributes:
      label: Open Codex version
      placeholder: commit or release
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex CLI version
      placeholder: Output of codex --version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15 arm64, Windows 11 x64, Ubuntu 24.04 x64
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps using a disposable repository where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
